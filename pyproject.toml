[project]
name = "sespy"
version = "0.0.1"
description = "Shiny for Python port of the MarineSABRES SES Toolbox — DAPSI(W)R(M) social-ecological systems analysis (Horizon Europe)."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "shiny>=1.5",
    "networkx>=3.0",
    "scipy>=1.10",          # required by networkx for pagerank / eigenvector centrality (network.py)
    "htmltools>=0.5",
    "pandas>=2.0",
    "numpy>=1.24",          # dynamics.py / Boolean + simulation matrices (also pandas-transitive, declared explicitly)
    # pyvis>=0.3 keeps the pip/library layer + CI installable from PyPI (upstream
    # 0.3.x). The full app's CLD/graph view needs `pyvis.shiny`, which lives in
    # the pyvis fork (v4.x) published on the `razinka` Anaconda channel:
    #   micromamba install -c razinka -c conda-forge pyvis
    # PyPI has no 4.x, so a pip-only env runs the library but not the app.
    # See README "Install it".
    "pyvis>=0.3",
    "matplotlib>=3.7",      # analysis @render.plot outputs (BOT, Boolean, simulation, metrics)
    "jinja2>=3.1",          # report.py HTML template rendering (hard import)
    "openpyxl>=3.1",        # pandas .xlsx engine for the Excel import feature
    "python-docx>=1.1",     # Word (.docx) report export
    "reportlab>=4.0",       # PIMS stakeholder summary PDF export (pure-Python, no native deps)
    "anthropic>=0.50,<0.101",
]

[project.optional-dependencies]
prod = ["python-igraph>=0.11"]
# PDF report export. Separate extra because WeasyPrint needs native system
# libraries (cairo, pango, gdk-pixbuf); install with `pip install sespy[pdf]`.
# HTML and Word export work without it.
pdf = ["weasyprint>=60"]
test = ["pytest>=8", "pytest-playwright>=0.5", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sespy*"]

[tool.setuptools.package-data]
sespy = ["*.json", "translations/*.json", "templates/*.json"]
