[project]
name = "sespy"
version = "1.2.0"
description = "Shiny for Python port of the MarineSABRES SES Toolbox — DAPSI(W)R(M) social-ecological systems analysis (Horizon Europe)."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "shiny>=1.5",
    "networkx>=3.0",
    "scipy>=1.10",          # required by networkx for pagerank / eigenvector centrality (network.py)
    "htmltools>=0.5",
    "pandas>=2.0",
    "numpy>=1.24",          # dynamics.py / Boolean + simulation matrices (also pandas-transitive, declared explicitly)
    # pyvis>=0.3 keeps the pip/library layer + CI installable from PyPI (upstream
    # 0.3.x). The full app's CLD/graph view needs `pyvis.shiny`, which lives in
    # the pyvis fork (v4.x) published on the `razinka` Anaconda channel:
    #   micromamba install -c razinka -c conda-forge pyvis
    # PyPI has no 4.x, so a pip-only env runs the library but not the app.
    # See README "Install it".
    "pyvis>=0.3",
    "matplotlib>=3.7",      # analysis @render.plot outputs (BOT, Boolean, simulation, metrics)
    "jinja2>=3.1",          # report.py HTML template rendering (hard import)
    "openpyxl>=3.1",        # pandas .xlsx engine for the Excel import feature
    "python-docx>=1.1",     # Word (.docx) report export
    "reportlab>=4.0",       # PIMS stakeholder summary PDF export (pure-Python, no native deps)
    "anthropic>=0.50,<0.101",
]

[project.optional-dependencies]
prod = ["python-igraph>=0.11"]
# PDF report export. Separate extra because WeasyPrint needs native system
# libraries (cairo, pango, gdk-pixbuf); install with `pip install sespy[pdf]`.
# HTML and Word export work without it.
pdf = ["weasyprint>=60"]
test = ["pytest>=8", "pytest-playwright>=0.5", "pytest-asyncio>=0.23", "pytest-cov>=4"]
lint = ["ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort. A focused, high-signal set —
# correctness + unused-import/name hygiene + import ordering.
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Test modules legitimately group imports into commented "sections" (e.g.
# importorskip guards, second topic-block imports), which trips E402; and
# e2e scripts embed long inline JS / absolute-path literals that can't wrap
# (E501).
"tests/**" = ["E402", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
# Pragmatic baseline for a Shiny app being incrementally typed: the codebase
# is not yet mypy-clean, so CI runs this as a non-blocking signal (see
# .github/workflows/ci.yml). Tighten toward strict as modules are annotated.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sespy*"]

[tool.setuptools.package-data]
sespy = ["*.json", "translations/*.json", "templates/*.json"]
