name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff) + type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .[lint]

      - name: Ruff (blocking)
        run: ruff check sespy tests scripts

      - name: Mypy (non-blocking — incremental adoption)
        # The codebase is being typed incrementally, so mypy is informational
        # for now. Flip continue-on-error to false once sespy is clean.
        continue-on-error: true
        run: mypy sespy

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Verify no UI dependencies were installed
        run: |
          python -c "import importlib.util as u, sys; bad=[m for m in ('shiny','htmltools','pyvis') if u.find_spec(m)]; sys.exit(f'UI deps installed: {bad}' if bad else 0)"

      - name: Run unit tests
        # Coverage is measured over the sespy package and printed as a summary
        # (term-missing). The PDF test auto-skips here (WeasyPrint is the `pdf`
        # extra and needs native libs).
        run: |
          pytest tests/ \
            --cov=sespy --cov-report=term-missing --cov-report=xml \
            -q
      - name: Upload coverage XML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  library-no-ui:
    name: Library without UI deps (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The sespy library must import and pass its tests with Shiny, htmltools
    # and the pyvis fork absent (the Shiny app lives in razinkele/sespy-app;
    # this repo is a plain library).
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run library tests (no Shiny)
        run: python scripts/run_library_tests.py
